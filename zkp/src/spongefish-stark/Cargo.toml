[package]
name = "spongefish-stark"
authors = ["Michele Orrù"]
description = "p3 STARK proofs for spongefish circuits"
edition = "2021"
license = "Apache-2.0"
readme = "README.md"
version = "0.1.0"

[features]
default = ["poseidon2", "keccak256", "p3-baby-bear", "p3-koala-bear"]
poseidon2 = ["dep:p3-poseidon2-air", "dep:p3-poseidon2"]
keccak256 = ["dep:keccak", "dep:p3-keccak-air"]
p3-baby-bear = ["dep:p3-baby-bear", "spongefish/p3-baby-bear", "spongefish-circuit/p3-baby-bear"]
p3-koala-bear = ["dep:p3-koala-bear", "spongefish/p3-koala-bear"]

[dependencies]
p3-air = { workspace = true }
p3-batch-stark = { workspace = true }
p3-baby-bear = { workspace = true, optional = true }
p3-challenger = { workspace = true }
p3-commit = { workspace = true }
p3-dft = { workspace = true }
p3-field = { workspace = true }
p3-fri = { workspace = true }
p3-keccak = { workspace = true }
p3-keccak-air = { workspace = true, optional = true }
p3-koala-bear = { workspace = true, optional = true }
p3-lookup = { workspace = true }
p3-matrix = { workspace = true }
p3-merkle-tree = { workspace = true }
p3-poseidon2-air = { workspace = true, optional = true }
p3-poseidon2 = { workspace = true, optional = true }
p3-symmetric = { workspace = true }
p3-uni-stark = { workspace = true }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rand = { version = "^0.10", default-features = false, features = ["chacha", "sys_rng"] }
keccak = { version = "^0.1.5", optional = true }
spongefish = { version = "^0.7.4", default-features = false }
spongefish-circuit = { version = "^0.7.4", default-features = false }

[dev-dependencies]
encrypted-spaces-crypto = { workspace = true }
hex-literal = "1.0"
serde = { workspace = true }

[[example]]
name = "poseidon2"
required-features = ["poseidon2", "p3-koala-bear"]

[[bench]]
name = "security_profile_sweep"
harness = false
required-features = ["poseidon2", "p3-koala-bear"]
